<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartas</title>
  <!-- a ordem dos arquivos e a ordem em que as regras valem -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cabecalho.css">
  <link rel="stylesheet" href="css/barra.css">
  <link rel="stylesheet" href="css/decks.css">
  <link rel="stylesheet" href="css/cronometro.css">
  <link rel="stylesheet" href="css/grade.css">
  <link rel="stylesheet" href="css/pilha.css">
  <link rel="stylesheet" href="css/carta.css">
  <link rel="stylesheet" href="css/aviso.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>
  <div class="pagina">

    <header class="cabecalho" id="cabecalho" hidden>
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
    </header>

    <nav class="decks" id="seletor-deck" aria-label="Escolha o baralho" hidden></nav>

    <div class="barra" id="barra" hidden>
      <div class="seletor-modo" id="seletor-modo" role="group" aria-label="Modo de exibição" hidden>
        <button type="button" class="botao" id="modo-grade" aria-pressed="false"></button>
        <button type="button" class="botao" id="modo-pilha" aria-pressed="false"></button>
      </div>
      <div class="filtros" id="filtros"></div>
      <div class="acoes">
        <span class="contador" id="contador" hidden></span>
        <div class="acoes-botoes">
          <button type="button" class="botao" id="btn-descartar" hidden></button>
          <button type="button" class="botao" id="btn-voltar" hidden></button>
          <button type="button" class="botao" id="btn-virar" hidden></button>
          <button type="button" class="botao" id="btn-reiniciar" hidden></button>
        </div>
      </div>
    </div>

    <!-- modo grade: todas as cartas lado a lado -->
    <main class="grade" id="grade" aria-live="polite"></main>

    <!-- modo pilha: baralho de um lado, descarte do outro -->
    <section class="pilha" id="pilha" aria-live="polite" hidden>
      <div class="pilha-coluna">
        <div class="pilha-slot" id="monte">
          <p class="pilha-vazia" id="pilha-vazia" hidden></p>
        </div>
        <span class="pilha-rotulo" id="rotulo-monte"></span>
      </div>
      <div class="pilha-coluna" id="coluna-descarte" hidden>
        <div class="pilha-slot" id="descarte"></div>
        <span class="pilha-rotulo" id="rotulo-descarte"></span>
      </div>
    </section>

    <div class="aviso" id="aviso" hidden></div>

    <!-- Modulos nao carregam por file://, entao o aviso de erro do js/ nunca
         apareceria no duplo clique. Este bloco cobre esse caso. -->
    <div class="aviso" id="aviso-arquivo" hidden>
      <h2>Abra a página por um servidor local</h2>
      <p>O navegador bloqueia a leitura dos arquivos quando a página é aberta
        com duplo clique (<code>file://</code>). Abra um terminal nesta pasta e rode:</p>
      <p><code>python -m http.server 8000</code></p>
      <p>Depois acesse <code>http://localhost:8000</code>.</p>
    </div>

  </div>

  <!-- script classico de proposito: precisa rodar mesmo sem os modulos -->
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('aviso-arquivo').hidden = false;
    }
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
